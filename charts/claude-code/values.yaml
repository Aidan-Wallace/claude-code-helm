# Claude Code Helm Chart Values

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the release
fullnameOverride: ""

# -- Override the pod's hostname (what `hostname` reports inside the
# container, e.g. in the shell prompt). Defaults to the pod's generated name.
hostnameOverride: ""

# Image configuration
image:
  # -- Container image repository. This image must already contain the `claude` binary.
  repository: ghcr.io/aidan-wallace/claude-code
  # -- Container image tag. Pin this to an explicit Claude Code version tag.
  tag: "2.1.270"
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# Runtime command configuration
# Default keeps the pod alive so you can exec in and run `claude`.
command:
  - sh
  - -lc
  - sleep infinity

# -- Optional args passed to the command
extraArgs: []

# -- Home directory for the container user; used for the HOME env var and the persistent volume mount
home: /home/codespace

# -- Non-secret environment variables
env: {}
# Example:
# env:
#   TZ: UTC
#   NODE_ENV: production

externalSecrets:
  # -- Render ExternalSecret resources
  enabled: false
  # -- Default refresh interval for ExternalSecret resources
  refreshInterval: 1h
  # -- ExternalSecret definitions with complete spec blocks
  items: []
    # - fullnameOverride: ssh-keys
    #   spec:
    #     secretStoreRef:
    #       name: bitwarden-secretsmanager
    #       kind: ClusterSecretStore
    #     data:
    #       - secretKey: authorized_keys
    #         remoteRef:
    #           key: ssh-keys
    #           conversionStrategy: Default
    #           decodingStrategy: None
    #           metadataPolicy: None
    # - fullnameOverride: anthropic-api-key
    #   spec:
    #     secretStoreRef:
    #       name: bitwarden-secretsmanager
    #       kind: ClusterSecretStore
    #     data:
    #       - secretKey: ANTHROPIC_API_KEY
    #         remoteRef:
    #           key: anthropic-api-key
    #           conversionStrategy: Default
    #           decodingStrategy: None
    #           metadataPolicy: None

# SSH access, off by default. Enabling this switches the container to run
# sshd as root instead of the idle process, since sshd needs root to bind
# port 22 and drop privileges per login.
ssh:
  # -- Run sshd and expose port 22 instead of the default idle command
  enabled: false
  # -- Authorized public keys, one per entry (e.g. "ssh-ed25519 AAAA... me@laptop")
  publicKeys: []
  # -- Use an existing secret (must have an "authorized_keys" key) instead of publicKeys
  existingSecret: ""

# Service for SSH access. Only created when ssh.enabled is true.
service:
  # -- Service type, e.g. LoadBalancer or NodePort
  type: LoadBalancer
  # -- Port to expose
  port: 22
  # -- Annotations for the service
  annotations: {}
  # -- Restrict which source IPs can reach the LoadBalancer
  loadBalancerSourceRanges: []
  loadBalancerIP: ""

# Credentials and secret wiring
credentials:
  # -- Use an existing secret instead of creating one
  existingSecret: ""
  # -- Anthropic API key; used when generating a chart-managed secret
  anthropicApiKey: ""
  # -- Additional key/value pairs to include in the chart-managed secret
  secretData: {}
  # Example:
  # secretData:
  #   ANTHROPIC_BASE_URL: "https://your-endpoint.example"

# Script run in the background after the container starts (every boot, so it
# must be idempotent). Runs as the codespace user via bash with `-euo pipefail`;
# output goes to ~/.post-init.log and the exit code to ~/.post-init.status.
# When ssh.enabled, it starts after the entrypoint has seeded an empty HOME.
# -- Bash script to run after boot (e.g. install extra tools, wire up secrets)
postInitScript: ""
# Example:
# postInitScript: |
#   mkdir -p ~/.local/bin
#   command -v ripgrep >/dev/null || sudo apt-get install -y ripgrep
#   ln -sfn /run/devserver-secrets/github/id_ed25519 ~/.ssh/id_ed25519

# -- Mount Secrets (typically created by an externalSecrets item, so the values
# come from the secret manager and never live in git) as read-only files.
# Each entry: secretName (required), mountPath (required), mode (default 0440),
# items (optional list of {key, path} to mount a subset), subPath (optional,
# mount a single key as a file; such mounts do not pick up rotations).
# NOTE: this controls where secrets appear, it is not an isolation boundary:
# every process running as the codespace user can read them. Use a separate
# release per trust boundary if you need real isolation.
secretMounts: []
# Example:
# secretMounts:
#   - secretName: github-deploy-key
#     mountPath: /run/devserver-secrets/github
#   - secretName: project-foo-env
#     mountPath: /home/codespace/code/foo/.secrets

# Persistence configuration for HOME
persistence:
  # -- Enable persistent storage for the home directory (see `home`)
  enabled: true
  # -- Storage size
  size: 5Gi
  # -- Storage class (leave empty for default)
  storageClass: ""
  # -- Access mode
  accessMode: ReadWriteOnce
  # -- Annotations for the PVC
  annotations: {}
  # -- Use an existing PVC instead of creating one
  existingClaim: ""

# Resource requests and limits for the Claude container
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 4000m
    memory: 8Gi

# Docker-in-Docker sidecar, off by default. Runs an isolated dockerd in the
# pod (its own storage, not the host's) so tools/agents can build and run
# containers. Requires a privileged sidecar container - see README.
dockerInDocker:
  # -- Run a docker:dind sidecar alongside the main container
  enabled: false
  image:
    repository: docker
    tag: "29-dind"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4Gi
  storage:
    # -- Size limit for the sidecar's /var/lib/docker (emptyDir, not persisted across restarts)
    sizeLimit: 20Gi

# Security context for the pod
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Security context for the Claude container
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault

# -- Keep stdin open for interactive kubectl exec sessions
stdin: true
# -- Allocate a TTY for interactive kubectl exec sessions
tty: true

# Service account configuration
serviceAccount:
  # -- Create a service account
  create: true
  # -- Service account name (auto-generated if empty)
  name: ""
  # -- Annotations for the service account
  annotations: {}

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Annotations for the pod
podAnnotations: {}

# -- Labels for the pod
podLabels: {}

# -- Additional Kubernetes resources to create alongside this release. Each
# entry is a complete manifest (apiVersion/kind/metadata/...) and supports
# templating (e.g. {{ include "claude-code.fullname" $ }}).
additionalManifests: []
# Example:
# additionalManifests:
#   - apiVersion: v1
#     kind: ConfigMap
#     metadata:
#       name: my-extra-configmap
#     data:
#       key: value
