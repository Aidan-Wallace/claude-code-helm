{{- $hasManagedSecret := and (not .Values.credentials.existingSecret) (or .Values.credentials.anthropicApiKey (not (empty .Values.credentials.secretData))) -}}
{{- $hasPostInit := not (empty .Values.postInitScript) -}}
{{- $hasAnySecret := or .Values.credentials.existingSecret $hasManagedSecret -}}
{{- if and .Values.ssh.enabled (not .Values.ssh.existingSecret) (not .Values.ssh.publicKeys) -}}
{{- fail "ssh.enabled requires ssh.publicKeys or ssh.existingSecret" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "claude-code.fullname" . }}
  labels:
    {{- include "claude-code.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "claude-code.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or $hasManagedSecret $hasPostInit .Values.podAnnotations }}
      annotations:
        {{- if $hasManagedSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if $hasPostInit }}
        checksum/post-init: {{ include (print $.Template.BasePath "/post-init-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "claude-code.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "claude-code.serviceAccountName" . }}
      {{- with .Values.hostnameOverride }}
      hostname: {{ . }}
      {{- end }}
      securityContext:
        {{- if .Values.ssh.enabled }}
        seccompProfile:
          type: RuntimeDefault
        {{- if .Values.secretMounts }}
        # secret files are root-owned; fsGroup makes them group-readable (0440)
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
        {{- else }}
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- end }}
      containers:
        - name: claude
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          stdin: {{ .Values.stdin }}
          tty: {{ .Values.tty }}
          {{- if $hasPostInit }}
          command:
            - /bin/sh
            - -c
            - '/opt/post-init/launcher.sh & exec "$@"'
            - sh
            {{- if .Values.ssh.enabled }}
            - /usr/local/bin/entrypoint.sh
            {{- else }}
            {{- toYaml .Values.command | nindent 12 }}
            {{- end }}
          {{- if .Values.extraArgs }}
          args:
            {{- toYaml .Values.extraArgs | nindent 12 }}
          {{- else if .Values.ssh.enabled }}
          args: [/usr/bin/supervisord, -n, -c, /etc/supervisor/supervisord.conf]
          {{- end }}
          {{- else }}
          {{- if not .Values.ssh.enabled }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if .Values.ssh.enabled }}
          ports:
            - name: ssh
              containerPort: 22
              protocol: TCP
          {{- end }}
          env:
            - name: HOME
              value: {{ .Values.home | quote }}
            {{- if .Values.dockerInDocker.enabled }}
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if $hasAnySecret }}
          envFrom:
            - secretRef:
                name: {{ include "claude-code.secretName" . }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- if .Values.ssh.enabled }}
            runAsUser: 0
            allowPrivilegeEscalation: true
            seccompProfile:
              type: RuntimeDefault
            {{- else }}
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: home
              mountPath: {{ .Values.home | quote }}
            {{- if .Values.ssh.enabled }}
            - name: ssh-keys
              mountPath: {{ .Values.home }}/.ssh/authorized_keys
              subPath: authorized_keys
              readOnly: true
            {{- end }}
            {{- if $hasPostInit }}
            - name: post-init
              mountPath: /opt/post-init
              readOnly: true
            {{- end }}
            {{- range $i, $m := .Values.secretMounts }}
            - name: secret-mount-{{ $i }}
              mountPath: {{ required "secretMounts[].mountPath is required" $m.mountPath | quote }}
              readOnly: true
              {{- with $m.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            {{- end }}
        {{- if .Values.dockerInDocker.enabled }}
        - name: dind
          image: "{{ .Values.dockerInDocker.image.repository }}:{{ .Values.dockerInDocker.image.tag }}"
          args:
            - dockerd
            - --host=tcp://0.0.0.0:2375
            - --tls=false
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.dockerInDocker.resources | nindent 12 }}
          volumeMounts:
            - name: docker-lib
              mountPath: /var/lib/docker
        {{- end }}
      volumes:
        - name: home
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "claude-code.pvcName" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.ssh.enabled }}
        - name: ssh-keys
          secret:
            secretName: {{ include "claude-code.sshSecretName" . }}
            # secret volumes mount as root; 0444 lets sshd read it after
            # dropping privileges to the target user (0400 leaves it root-only)
            defaultMode: 0444
        {{- end }}
        {{- if $hasPostInit }}
        - name: post-init
          configMap:
            name: {{ include "claude-code.postInitName" . }}
            defaultMode: 0555
        {{- end }}
        {{- range $i, $m := .Values.secretMounts }}
        - name: secret-mount-{{ $i }}
          secret:
            secretName: {{ required "secretMounts[].secretName is required" $m.secretName }}
            defaultMode: {{ $m.mode | default 0440 | int }}
            {{- with $m.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- if .Values.dockerInDocker.enabled }}
        - name: docker-lib
          emptyDir:
            sizeLimit: {{ .Values.dockerInDocker.storage.sizeLimit }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
