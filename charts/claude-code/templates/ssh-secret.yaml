{{- if and .Values.ssh.enabled (not .Values.ssh.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-code.sshSecretName" . }}
  labels:
    {{- include "claude-code.labels" . | nindent 4 }}
type: Opaque
stringData:
  authorized_keys: |
    {{- range .Values.ssh.publicKeys }}
    {{ . }}
    {{- end }}
{{- end }}
